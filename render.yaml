services:
  - type: web
    name: welfare-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: welfare-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: welfare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: welfare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: welfare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: welfare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: welfare-db
          property: password
      - key: API_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: BACKUP_RETENTION_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://welfare-ui.onrender.com"]'

  - type: web
    name: welfare-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://welfare-api.onrender.com/api

databases:
  - name: welfare-db
    databaseName: welfare_facilities_db
    user: welfare_app
    plan: free
